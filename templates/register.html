{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        🚀 Регистрация
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Имя пользователя
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Пароль
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Создать аккаунт

                        </button>

                    </form>

                    <hr>

                    <p class="text-center">

                        Уже есть аккаунт?

                        <a href="/login">
                            Войти
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

body{
    background: linear-gradient(
        135deg,
        #4facfe,
        #00f2fe
    );
    min-height:100vh;
}

.card{
    border-radius:20px;
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

{% endblock %}
