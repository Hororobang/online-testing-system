{% extends "base.html" %}

{% block content %}

<h2>Регистрация</h2>

<form method="POST">

<input
class="form-control mb-2"
name="username"
placeholder="Имя">

<input
class="form-control mb-2"
name="email"
placeholder="Email">

<input
class="form-control mb-2"
type="password"
name="password"
placeholder="Пароль">

<button class="btn btn-success">
Зарегистрироваться
</button>

</form>

{% endblock %}
