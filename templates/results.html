{% extends "base.html" %}

{% block content %}

<h2>Мои результаты</h2>

<table class="table">

    <thead>

        <tr>
            <th>ID</th>
            <th>Баллы</th>
        </tr>

    </thead>

    <tbody>

    {% for result in results %}

        <tr>

            <td>{{ result.id }}</td>

            <td>{{ result.score }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
