{% extends "base.html" %}

{% block content %}

<h2>Доступные тесты</h2>

<div class="row">

{% for test in tests %}

<div class="col-md-4">

    <div class="card mb-3">

        <div class="card-body">

            <h5>{{ test.title }}</h5>

            <p>{{ test.description }}</p>

            <a href="/take_test/{{ test.id }}"
               class="btn btn-primary">

                Начать

            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
